<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cafeteria Mais Amor | Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="container nav"><a class="logo" href="index.html">☕ Cafeteria <span>Mais Amor</span></a><button
                onclick="document.querySelector('.links').classList.toggle('open')"
                style="display:none;background:none;color:white;border:0;font-size:24px" id="menub">☰</button>
            <div class="links"><a class="" href="index.html">Home</a><a class="" href="cafe.html">Cafés</a><a class=""
                    href="paes.html">Pães & Delícias</a><a class="active" href="cadastro.html">Cadastro</a><a class=""
                    href="login.html">Login</a><a class="" href="admin.html">Administrador</a></div>
        </div>
    </nav>
    <header class="hero">
        <div class="container">
            <h1>Cadastro</h1>
            <p>Crie sua conta na Cafeteria Mais Amor.</p>
        </div>
    </header>
    <section>
        <div class="container">
            <form class="form" id="f">
                <div class="title">
                    <h2>Crie sua conta</h2>
                </div>
                <div class="fields">
                    <div class="field"><label>Nome</label><input id="nome" required></div>
                    <div class="field"><label>WhatsApp</label><input id="tel" required></div>
                    <div class="field full"><label>E-mail</label><input id="email" type="email" required></div>
                    <div class="field"><label>Senha</label><input id="senha" type="password" required minlength="4">
                    </div>
                    <div class="field"><label>Confirmar senha</label><input id="conf" type="password" required
                            minlength="4"></div>
                    <div class="full"><button class="btn">Criar conta</button></div>
                </div>
                <div class="msg" id="msg"></div>
            </form>
        </div>
    </section>
    <footer>
        <div class="container">
            <div class="footer">
                <div>
                    <h3>☕ Cafeteria Mais Amor</h3>
                    <p>Café, carinho e bons momentos.</p>
                </div>
                <div>
                    <h4>Site</h4>
                    <p><a href="index.html">Home</a><br><a href="cafe.html">Cafés</a><br><a href="paes.html">Pães &
                            Delícias</a></p>
                </div>
                <div>
                    <h4>Atendimento</h4>
                    <p>Segunda a sábado<br>8h às 19h</p>
                </div>
            </div>
            <div class="copy">© 2026 Cafeteria Mais Amor</div>
        </div>
    </footer>
    <script>const u = localStorage.getItem('cafeUsuario'); if (u) { document.querySelector('.logo').innerHTML = '☕ Cafeteria <span>Mais Amor</span> · Olá, ' + u + '!' } document.getElementById('f').onsubmit = e => { e.preventDefault(); let n = nome.value, e1 = email.value, s = senha.value; if (s !== conf.value) { msg.textContent = 'As senhas não são iguais.'; msg.classList.add('show'); return } localStorage.setItem('cafeNome', n); localStorage.setItem('cafeEmail', e1); localStorage.setItem('cafeSenha', s); localStorage.setItem('cafeUsuario', n); msg.textContent = 'Conta criada com sucesso! Você já está logado.'; msg.classList.add('show'); setTimeout(() => location = 'index.html', 800) }</script>
</body>

</html>
