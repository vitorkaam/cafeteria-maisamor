<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"><title>Painel · CafeteriaMaisAmor</title><link rel="stylesheet" href="static/css/style.css">
<style>.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-bottom:1.2rem}.row input,.order select{font:inherit;padding:.55rem .8rem;border:2px solid var(--caramel-l);border-radius:12px;color:var(--brown)}.pl{display:flex;gap:.6rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--caramel-l);flex-wrap:wrap}.pl span:first-child{flex:1;min-width:180px}.off{opacity:.5}</style></head><body>
<header><div class="nav"><a class="logo" href="index.html">Cafeteria<span>MaisAmor</span></a><a class="lk" href="index.html">Voltar ao site</a><div id="authArea"></div></div></header>
<main><h2>Painel da cafeteria</h2><div class="chips" id="tabs" style="margin-top:1rem"><button class="chip on" data-t="ped">Pedidos</button><button class="chip" data-t="prod">Produtos</button><button class="chip" data-t="cli">Clientes</button></div><div id="msg"></div><div id="view"></div></main>
<script src="static/js/auth.js"></script>
<script>
const ST={NOVO:'Novo',PREPARANDO:'Preparando',PRONTO:'Pronto',ENTREGUE:'Entregue',CANCELADO:'Cancelado'};
const E=Auth.esc,brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),V=document.getElementById('view'),M=document.getElementById('msg');
let tab='ped',PL=[];const u=Auth.current();
const say=(t,k)=>{M.className='msg '+k;M.textContent=t;setTimeout(()=>{M.className='';M.textContent=''},3500)};
const bad=r=>'<div class="msg err">'+E(r.error)+'</div>';
async function show(){
 if(tab==='ped'){const r=await Auth.api('/api/admin/orders');if(!r.ok)return V.innerHTML=bad(r);
  V.innerHTML=r.data.length?r.data.map(o=>'<div class="order"><div class="order-h"><span>Pedido '+String(o.id).padStart(3,'0')+' · '+E(o.cliente.nome)+'</span><span>'+new Date(o.criadoEm).toLocaleString('pt-BR')+'</span></div><div>'+o.itens.map(i=>i.qtd+'× '+E(i.nome)).join(', ')+'</div><div class="tot" style="margin:.6rem 0"><span>Total</span><span>'+brl(o.total)+'</span></div><select data-o="'+o.id+'">'+Object.keys(ST).map(k=>'<option value="'+k+'"'+(k===o.status?' selected':'')+'>'+ST[k]+'</option>').join('')+'</select></div>').join(''):'<p class="empty">Nenhum pedido ainda.</p>'}
 if(tab==='prod'){const r=await Auth.api('/api/admin/products');if(!r.ok)return V.innerHTML=bad(r);PL=r.data;
  V.innerHTML='<form id="pf" class="row"><input type="hidden" id="pid"><input id="pn" placeholder="Nome" required><input id="pc" placeholder="Categoria" required><input id="pp" type="number" step="0.01" min="0.01" placeholder="Preço" required><input id="pi" placeholder="Ícone (emoji)"><input id="pd" placeholder="Descrição"><button class="btn" type="submit">Salvar produto</button></form>'+PL.map(p=>'<div class="pl'+(p.ativo?'':' off')+'"><span>'+E(p.icone||'')+' <b>'+E(p.nome)+'</b> · '+E(p.categoria||'')+'</span><span>'+brl(p.preco)+'</span><button class="btn ghost sm" data-ed="'+p.id+'">Editar</button><button class="btn ghost sm" data-tg="'+p.id+'">'+(p.ativo?'Ocultar':'Mostrar')+'</button><button class="btn ghost sm" data-rm="'+p.id+'">Excluir</button></div>').join('')}
 if(tab==='cli'){const r=await Auth.api('/api/admin/users');if(!r.ok)return V.innerHTML=bad(r);
  V.innerHTML=r.data.map(c=>'<div class="pl"><span><b>'+E(c.nome)+'</b> · '+E(c.email)+'</span><span>'+E(c.telefone||'sem telefone')+'</span><span>'+(c.role==='ADMIN'?'Administrador':'Cliente')+'</span></div>').join('')}}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;[...tabs.children].forEach(x=>x.classList.toggle('on',x===b));show()}};
V.addEventListener('change',async e=>{const s=e.target.closest('[data-o]');if(!s)return;const r=await Auth.api('/api/admin/orders/'+s.dataset.o,{method:'PATCH',body:{status:s.value}});say(r.ok?'Status atualizado.':r.error,r.ok?'ok':'err')});
V.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.ed){const p=PL.find(x=>x.id==b.dataset.ed);pid.value=p.id;pn.value=p.nome;pc.value=p.categoria||'';pp.value=p.preco;pi.value=p.icone||'';pd.value=p.descricao||'';pn.focus()}
 if(b.dataset.tg){const p=PL.find(x=>x.id==b.dataset.tg),r=await Auth.api('/api/admin/products/'+p.id,{method:'PUT',body:{...p,ativo:!p.ativo}});say(r.ok?'Produto atualizado.':r.error,r.ok?'ok':'err');show()}
 if(b.dataset.rm&&confirm('Excluir este produto?')){const r=await Auth.api('/api/admin/products/'+b.dataset.rm,{method:'DELETE'});say(r.ok?'Produto excluído.':r.error,r.ok?'ok':'err');show()}});
V.addEventListener('submit',async e=>{e.preventDefault();const body={nome:pn.value,categoria:pc.value,preco:Number(pp.value),icone:pi.value,descricao:pd.value,ativo:true},id=pid.value;
 const r=await Auth.api('/api/admin/products'+(id?'/'+id:''),{method:id?'PUT':'POST',body});say(r.ok?'Produto salvo.':r.error,r.ok?'ok':'err');if(r.ok)show()});
if(!u||u.role!=='ADMIN'){document.querySelector('main').innerHTML='<div class="gate"><h3>Área restrita</h3><p>Entre com a conta de administrador para acessar o painel.</p><a class="btn" href="login.html?next=admin.html">Entrar</a></div>'}else show();
</script></body></html>
