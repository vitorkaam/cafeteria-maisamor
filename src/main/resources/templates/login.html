<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cafeteria Mais Amor | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="container nav"><a class="logo" href="index.html">☕ Cafeteria <span>Mais Amor</span></a><button
                onclick="document.querySelector('.links').classList.toggle('open')"
                style="display:none;background:none;color:white;border:0;font-size:24px" id="menub">☰</button>
            <div class="links"><a class="" href="index.html">Home</a><a class="" href="cafe.html">Cafés</a><a class=""
                    href="paes.html">Pães & Delícias</a><a class="" href="cadastro.html">Cadastro</a><a class="active"
                    href="login.html">Login</a><a class="" href="admin.html">Administrador</a></div>
        </div>
    </nav>
    <header class="hero">
        <div class="container">
            <h1>Login</h1>
            <p>Entre na sua conta.</p>
        </div>
    </header>
    <section>
        <div class="container">
            <form class="form" style="max-width:450px" id="f">
                <div class="title">
                    <h2>Entrar</h2>
                </div>
                <div class="field"><label>E-mail</label><input id="email" type="email" required></div><br>
                <div class="field"><label>Senha</label><input id="senha" type="password" required></div><br><button
                    class="btn" style="width:100%">Entrar</button>
                <div class="msg" id="msg"></div>
                <p style="text-align:center;margin-top:18px">Não tem conta? <a href="cadastro.html"
                        style="color:#704936;font-weight:bold">Cadastre-se</a></p>
            </form>
        </div>
    </section>
    <footer>
        <div class="container">
            <div class="footer">
                <div>
                    <h3>☕ Cafeteria Mais Amor</h3>
                    <p>Café, carinho e bons momentos.</p>
                </div>
                <div>
                    <h4>Site</h4>
                    <p><a href="index.html">Home</a><br><a href="cafe.html">Cafés</a><br><a href="paes.html">Pães &
                            Delícias</a></p>
                </div>
                <div>
                    <h4>Atendimento</h4>
                    <p>Segunda a sábado<br>8h às 19h</p>
                </div>
            </div>
            <div class="copy">© 2026 Cafeteria Mais Amor</div>
        </div>
    </footer>
    <script>const u = localStorage.getItem('cafeUsuario'); if (u) { document.querySelector('.logo').innerHTML = '☕ Cafeteria <span>Mais Amor</span> · Olá, ' + u + '!' } document.getElementById('f').onsubmit = e => { e.preventDefault(); if (email.value === localStorage.getItem('cafeEmail') && senha.value === localStorage.getItem('cafeSenha')) { localStorage.setItem('cafeUsuario', localStorage.getItem('cafeNome')); msg.textContent = 'Login realizado!'; msg.classList.add('show'); setTimeout(() => location = 'index.html', 700) } else { msg.textContent = 'E-mail ou senha incorretos.'; msg.classList.add('show') } }</script>
</body>

</html>
