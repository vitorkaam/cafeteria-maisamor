<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Hanken+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet">
    <title>Entrar · CafeteriaMaisAmor</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/login.css">
</head>

<body>
    <div class="auth">
        <div class="box"><a class="logo" href="index.html">Cafeteria<span>MaisAmor</span></a>
            <h1>Entrar</h1>
            <div id="msg" role="alert"></div>
            <form id="login-form" novalidate>
                <div class="f"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email">
                    <div class="hint"></div>
                </div>
                <div class="f"><label for="senha">Senha</label>
                    <div class="w"><input id="senha" type="password" autocomplete="current-password"><button
                            type="button" class="eye">Mostrar</button></div>
                    <div class="hint"></div>
                </div><button class="btn" type="submit">Entrar</button>
            </form>
            <div class="lnks"><a href="#" id="forgot">Esqueci minha senha</a><a href="cadastro.html">Ainda não tenho uma
                    conta? Criar cadastro</a></div>
        </div>
    </div>
    <script src="static/js/auth.js"></script>
</body>

</html>F
