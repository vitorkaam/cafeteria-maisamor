<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"><title>CafeteriaMaisAmor</title><link rel="stylesheet" href="static/css/style.css"></head><body>
<header><div class="nav"><a class="logo" href="index.html">Cafeteria<span>MaisAmor</span></a>
<a class="lk on" href="index.html">Início</a><a class="lk " href="index.html#produtos">Produtos</a><a class="lk " href="pedidos.html">Pedidos</a>
<div id="authArea"></div><button class="btn sm cartbtn" id="openCart">Carrinho<b class="cc">0</b></button></div></header>
<section class="hero"><div><h1>Café feito com mais amor.</h1><p>Grãos selecionados, calda de caramelo da casa e pães assados toda manhã. Peça pelo site e retire no balcão.</p><a class="btn" href="#produtos">Ver o cardápio</a></div></section>
<main id="produtos"><h2>Nosso cardápio</h2>
<div class="tools"><input id="q" type="search" placeholder="Buscar produto..." aria-label="Buscar produto"><select id="ord" aria-label="Ordenar"><option value="">Ordenar</option><option value="a">Menor preço</option><option value="b">Maior preço</option><option value="n">Nome (A-Z)</option></select></div>
<div class="chips" id="chips"></div><div class="grid" id="grid"></div></main>
<footer class="site">© CafeteriaMaisAmor · Aberto todos os dias, das 8h às 19h</footer>
<div class="veil" id="veil"></div><aside class="drawer" id="drawer" aria-label="Carrinho"><h2>Seu carrinho <button class="btn ghost sm" id="closeCart">Fechar</button></h2><div class="items"></div><div class="ft"><div id="cmsg"></div><div class="tot"><span>Total</span><span>R$ 0,00</span></div><button class="btn" id="finish">Finalizar pedido</button></div></aside><script src="static/js/auth.js"></script><script src="static/js/store.js"></script>
<script>
let cat='Todos';const E=Auth.esc;
ready.then(()=>{const cats=['Todos',...new Set(PRODUCTS.map(p=>p.categoria))];
chips.innerHTML=cats.map(c=>`<button class="chip${c==='Todos'?' on':''}">${E(c)}</button>`).join('');draw()});
chips.onclick=e=>{if(e.target.classList.contains('chip')){cat=e.target.textContent;[...chips.children].forEach(b=>b.classList.toggle('on',b===e.target));draw()}};
q.oninput=ord.onchange=()=>draw();
grid.onclick=e=>{const b=e.target.closest('[data-add]');if(b){Cart.add(+b.dataset.add);renderCart();b.textContent='Adicionado ✓';setTimeout(()=>b.textContent='Adicionar',900)}};
function draw(){let l=PRODUCTS.filter(p=>(cat==='Todos'||p.categoria===cat)&&(p.nome+(p.descricao||'')).toLowerCase().includes(q.value.toLowerCase()));
 if(ord.value==='a')l.sort((a,b)=>a.preco-b.preco);if(ord.value==='b')l.sort((a,b)=>b.preco-a.preco);if(ord.value==='n')l.sort((a,b)=>a.nome.localeCompare(b.nome));
 grid.innerHTML=l.length?l.map(p=>`<article class="card"><div class="ic">${E(p.icone||'☕')}</div><div class="bd"><h3>${E(p.nome)}</h3><p>${E(p.descricao||'')}</p><div class="pr"><strong>${brl(p.preco)}</strong><button class="btn sm" data-add="${p.id}">Adicionar</button></div></div></article>`).join(''):'<p class="empty">Nenhum produto encontrado. Tente outra busca.</p>'}
</script></body></html>
