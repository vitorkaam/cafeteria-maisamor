<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"><title>Meus pedidos · CafeteriaMaisAmor</title><link rel="stylesheet" href="static/css/style.css"></head><body>
<header><div class="nav"><a class="logo" href="index.html">Cafeteria<span>MaisAmor</span></a>
<a class="lk " href="index.html">Início</a><a class="lk " href="index.html#produtos">Produtos</a><a class="lk on" href="pedidos.html">Pedidos</a>
<div id="authArea"></div><button class="btn sm cartbtn" id="openCart">Carrinho<b class="cc">0</b></button></div></header>
<main><h2>Meus pedidos</h2><div id="list"></div></main>
<div class="veil" id="veil"></div><aside class="drawer" id="drawer" aria-label="Carrinho"><h2>Seu carrinho <button class="btn ghost sm" id="closeCart">Fechar</button></h2><div class="items"></div><div class="ft"><div id="cmsg"></div><div class="tot"><span>Total</span><span>R$ 0,00</span></div><button class="btn" id="finish">Finalizar pedido</button></div></aside><script src="static/js/auth.js"></script><script src="static/js/store.js"></script>
<script>const ST={NOVO:'Novo',PREPARANDO:'Preparando',PRONTO:'Pronto para retirada',ENTREGUE:'Entregue',CANCELADO:'Cancelado'};
addEventListener('DOMContentLoaded',async()=>{const u=Auth.current(),L=document.getElementById('list');
if(!u){L.innerHTML='<div class="gate"><h3>Entre para ver seus pedidos</h3><p>É necessário entrar na sua conta para acompanhar e finalizar pedidos.</p><a class="btn" href="login.html?next=pedidos.html">Entrar</a></div>';return}
const r=await Auth.api('/api/orders/mine');
if(!r.ok){L.innerHTML=`<div class="msg err">${Auth.esc(r.error)}</div>`;return}
L.innerHTML=r.data.length?r.data.map(x=>`<div class="order"><div class="order-h"><span>Pedido ${String(x.id).padStart(3,'0')} · ${ST[x.status]||x.status}</span><span>${new Date(x.criadoEm).toLocaleString('pt-BR')}</span></div>${x.itens.map(i=>`<div>${i.qtd}× ${Auth.esc(i.nome)} — ${brl(i.preco*i.qtd)}</div>`).join('')}<div class="tot" style="margin-top:.6rem"><span>Total</span><span>${brl(x.total)}</span></div></div>`).join(''):'<div class="gate"><h3>Nenhum pedido ainda</h3><p>Escolha algo no cardápio e faça seu primeiro pedido.</p><a class="btn" href="index.html#produtos">Ver cardápio</a></div>'});</script></body></html>
